<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziggy Spells</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, encouraging — a 9-year-old's practice buddy
   IDEA: a flash-card deck held by Ziggy the little brown dachshund
   PICTURE: Ziggy, drawn large, reacting to each answer
   COLOUR and TYPE: sunflower yellow field, chocolate brown, red collar accent; Secular One + Rubik
   LAYOUT: one centred card at a time, big type, big buttons, no typing needed */
:root{color-scheme:light dark;
 --bg:light-dark(#ffd23f,#2b1a0f);--card:light-dark(#fffaf0,#3d2617);--ink:light-dark(#2b1a0f,#fff3dc);
 --soft:light-dark(#6b4a33,#e6c9a3);--brown:#9a5428;--brown2:#6e3815;--tan:#d99a5e;--red:#e0433a;--ok:#2f8f4e;--line:light-dark(#f0dfbf,#5a3a24)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:clamp(16px,3vw,36px) max(4vw,14px) 48px}
h1,h2,.big{font-family:"Secular One",Rubik,sans-serif;font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(36px,6vw,54px)}h2{font-size:clamp(26px,4vw,36px)}
.dog{width:100%;max-width:440px;display:block;margin:0 auto}
.hero-dog{max-width:190px;margin:0 auto}@media(min-width:700px){.hero-dog{max-width:260px}}
.dog .tail{transform-origin:64px 96px;animation:wag 1.1s ease-in-out infinite}
.dog.happy{animation:hop .6s ease}.dog.happy .tail{animation-duration:.25s}
.dog.sad .head{transform:rotate(8deg);transform-origin:250px 80px;transition:transform .3s}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
@media(prefers-reduced-motion:reduce){.dog .tail,.dog.happy{animation:none}}
.card{background:var(--card);border-radius:28px;padding:clamp(20px,4vw,40px);box-shadow:0 10px 0 var(--brown2),0 18px 40px #0003;margin-top:14px}
.center{text-align:center}
.lead{color:var(--soft);font-size:18px;margin:8px 0 0}
.btn{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:18px;padding:16px 26px;min-height:56px;cursor:pointer;background:var(--brown);color:#fff;box-shadow:0 5px 0 var(--brown2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brown2)}
.btn:focus-visible,.link:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid var(--red);outline-offset:3px}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #1d5e32}.btn.no{background:var(--red);box-shadow:0 5px 0 #9b2a23}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--brown)}
.modes{display:grid;gap:14px;margin-top:22px}
.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:start;gap:2px}
.mode small{font-weight:400;font-size:16px;opacity:.9}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.tip{background:var(--line);border-radius:16px;padding:12px 16px;margin-top:18px;font-size:16px}
.link{background:none;border:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer;padding:12px;min-height:44px;opacity:.8}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.bar{flex:1;height:14px;background:#0002;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);border-radius:9px;transition:width .4s}
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:15px;border-radius:99px;padding:4px 14px}
.q{font-size:clamp(22px,3.4vw,30px);font-weight:500;margin:16px 0 0;line-height:1.45}
.q p{margin:0 0 6px}
.word{font-size:clamp(48px,10vw,84px);color:var(--brown);margin-top:6px}
.ask{color:var(--soft);font-size:19px;margin-top:18px}
.ans{border-top:3px dashed var(--line);margin-top:22px;padding-top:18px}
.lbl{font-size:15px;font-weight:700;color:var(--soft)}
.score{font-size:clamp(54px,11vw,90px);color:var(--brown)}
ul.miss{list-style:none;padding:0;margin:16px 0 0;text-align:start}
ul.miss li{padding:10px 0;border-bottom:2px solid var(--line)}ul.miss b{font-size:22px;color:var(--brown)}
textarea{width:100%;min-height:260px;font:16px/1.6 Rubik,sans-serif;border:3px solid var(--line);border-radius:16px;padding:14px;background:var(--card);color:var(--ink);direction:rtl}
input[type=text]{width:100%;font:inherit;font-size:17px;border:3px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink)}
.datesel{width:100%;margin-top:8px;font:inherit;font-weight:700;font-size:20px;border:3px solid var(--brown);border-radius:16px;padding:14px 16px;min-height:56px;background:var(--card);color:var(--ink);cursor:pointer}
.datesel:focus-visible{outline:4px solid var(--red);outline-offset:3px}
.msg{font-weight:700;margin-top:10px;min-height:1.5em}
.hide{display:none!important}
.keys{font-size:14px;color:var(--soft);margin-top:14px}
@media(max-width:600px){.btn{width:100%}.row{flex-direction:column}}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:700}
.status{font-weight:500;margin:6px 0 12px}.status.cached,.status.error{color:var(--red)}
.card.dim{opacity:.6}.btn:disabled{cursor:wait;filter:grayscale(.4)}
.spk{display:inline-flex;align-items:center;gap:10px;justify-content:center}
.big-spk{font-size:24px;padding:20px 34px}
a.link{display:inline-block}
@media(max-width:600px){
.wrap{padding-top:10px;padding-bottom:24px}
.dog{max-width:180px}.play-dog{max-width:96px!important}
h1{font-size:30px}h2{font-size:21px}
.lead{font-size:16px;margin-top:2px}.status{margin:2px 0 6px;font-size:14px}
.card{padding:16px;border-radius:22px;margin-top:8px;box-shadow:0 6px 0 var(--brown2),0 12px 28px #0003}
.modes{gap:10px;margin-top:12px}
.btn{font-size:18px;padding:11px 16px;min-height:48px}.mode small{font-size:14px}
.tip{margin-top:10px;font-size:14px;padding:9px 12px}
.word{font-size:42px}.q{font-size:19px;margin-top:8px}.ask{font-size:16px;margin-top:10px}
.ans{margin-top:12px;padding-top:12px}.big-spk{font-size:20px;padding:14px 22px}
.keys{display:none}.row{margin-top:12px;gap:10px}
.row.pair{flex-direction:row}.row.pair .btn{flex:1;width:auto}
.score{font-size:56px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="ziggy" viewBox="0 0 330 190">
  <ellipse cx="165" cy="178" rx="128" ry="9" fill="#0003"/>
  <g class="tail"><path d="M66 96 Q40 80 30 52" stroke="#9a5428" stroke-width="11" fill="none" stroke-linecap="round"/></g>
  <rect x="80" y="118" width="20" height="54" rx="9" fill="#6e3815"/>
  <rect x="104" y="118" width="20" height="54" rx="9" fill="#9a5428"/>
  <rect x="198" y="118" width="20" height="54" rx="9" fill="#6e3815"/>
  <rect x="222" y="118" width="20" height="54" rx="9" fill="#9a5428"/>
  <rect x="58" y="78" width="196" height="66" rx="33" fill="#9a5428"/>
  <ellipse cx="158" cy="132" rx="76" ry="11" fill="#d99a5e"/>
  <path d="M80 86 Q150 72 230 84" stroke="#b86a37" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7"/>
  <rect x="226" y="80" width="14" height="44" rx="6" fill="#e0433a" transform="rotate(-12 233 102)"/>

  <g class="head">
   <circle cx="256" cy="72" r="32" fill="#9a5428"/>
   <ellipse cx="288" cy="86" rx="30" ry="17" fill="#9a5428"/>
   <ellipse cx="292" cy="92" rx="22" ry="9" fill="#d99a5e"/>
   <circle cx="314" cy="80" r="7.5" fill="#2b1a0f"/>
   <circle cx="312" cy="77.5" r="2" fill="#fff" opacity=".7"/>
   <path d="M290 98 Q298 104 306 98" stroke="#2b1a0f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
   <circle cx="268" cy="64" r="5.5" fill="#2b1a0f"/><circle cx="270" cy="62" r="1.8" fill="#fff"/>
   <path d="M246 48 Q222 56 228 98 Q232 116 246 108 Q256 84 252 52 Z" fill="#6e3815"/>
  </g>
 </symbol>
</svg>
<script>
{
const CFG = {"lang": "en", "sheet": "1wKSXIcG6xzX1eQ3nl1SIi2ciwMZutLUDYCvGVW3Z4Hc", "title": "Ziggy Spells", "sub": "הכנה להכתבה באנגלית", "modes": [["tr", "מעברית לאנגלית", "זיגי מראה מילה בעברית, את כותבת אותה באנגלית"], ["dict", "הכתבה", "זיגי אומר מילה באנגלית, את כותבת אותה"], ["tr,dict", "סבב מלא", "קודם מעברית לאנגלית ואחר כך הכתבה"]], "other": ["hebrew.html", "להכתבה בעברית"]};
const CACHE = 'zg-' + CFG.lang;

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
const clean = s => (s||'').replace(/[֑-ֽֿ-ׇ]/g,'').replace(/\r/g,'').replace(/[ \t]+/g,' ').trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const fmtDef = d => esc(d).replace(/\s*(\d)\.\s*/g,'\n$1. ').trim().split('\n').map(p=>`<p>${p}</p>`).join('');

function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f='' }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f='' }
    else if(c!=='\r') f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row) }
  return rows;
}
// Each dictation (a "week") is a block of 10 rows. Columns: A=date, B=number(1..10), C=word, D=meaning.
// The date sits in column A on the block's first row only, so a new block starts whenever the number is 1.
function buildWeeks(rows){
  const weeks = []; let cur = null;
  for (const r of rows){
    const date = clean(r[0]), n = clean(r[1]).replace(/\.0+$/,''), w = clean(r[2]), d = clean(r[3]);
    if (!/^\d+$/.test(n)) continue;              // skip the header row and any blank lines
    if (n === '1' || !cur){ cur = { date, words: [] }; weeks.push(cur); }
    if (date && !cur.date) cur.date = date;
    if (w) cur.words.push({ w, d });
  }
  return weeks.filter(wk => wk.words.length);     // keep only weeks that actually have words
}
async function loadWeeks(){
  const base = `https://docs.google.com/spreadsheets/d/${CFG.sheet}/`;
  const urls = [
    base + 'gviz/tq?tqx=out:csv&headers=1&tq=' + encodeURIComponent('select A,B,C,D'),
    base + 'export?format=csv'
  ];
  for (const u of urls){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if(!r.ok) continue;
      const weeks = buildWeeks(parseCSV(await r.text()));
      if (weeks.length) return weeks;
    }catch(e){}
  }
  return null;
}

/* ---------- speech (English only) ----------
   Primary: a real human US recording from Wikimedia (crystal clear, consistent accent).
   "לאט" slows the recording with a pitch-preserving playbackRate (which actually works).
   Fallback: the device voice, for any word with no recording or on browsers without OGG. */
let voice = null;
const canSpeak = 'speechSynthesis' in window;
const canAudio = typeof Audio !== 'undefined';
const canPlay = canSpeak || canAudio;
// novelty / robotic voices some systems list under en-US — never read spelling words with these
const BAD = /\(|bells|boing|bubbles|bad news|bahh|cellos|organ|pipe|trinoids|whisper|wobble|zarvox|albert|jester|superstar|good news|deranged|hysterical|flo|grandma|grandpa|reed|rocko|sandy|shelley|eddy|junior|ralph|fred|kathy/i;
// choose the clearest American device voice available, in preference order
function pickVoice(){
  if(!canSpeak) return;
  const us = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
  const pref = ['Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Ava','Microsoft Michelle','Microsoft Guy','Samantha','Ava','Allison','Susan','Zoe','Nicky','Alex','Microsoft Zira'];
  voice = pref.map(n => us.find(v => v.name.includes(n))).find(Boolean)
       || us.find(v => /natural|neural|enhanced|premium|google/i.test(v.name))
       || us.find(v => !BAD.test(v.name))
       || us[0] || null;
}
if (canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

// --- Wikimedia human recordings: look up "En-us-<word>.ogg", remember the result ---
const REC = {};  // word -> url | null (session cache)
function recKey(w){ return 'rec-' + w; }
async function findRec(word){
  const w = (word||'').trim();
  if (!w || !canAudio) return null;
  if (w in REC) return REC[w];
  const saved = store.get(recKey(w));
  if (saved !== null){ REC[w] = saved || null; return REC[w]; }   // '' = known to have none
  // try the word as written and lowercased (covers proper nouns like Spain / England)
  const tries = [...new Set([w, w.toLowerCase()])];
  let url = null;
  for (const t of tries){
    try{
      const u = `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent('File:En-us-' + t + '.ogg')}&prop=imageinfo&iiprop=url&format=json&origin=*`;
      const r = await fetch(u); const d = await r.json();
      const pages = d.query.pages, k = Object.keys(pages)[0];
      if (k !== '-1' && pages[k].imageinfo){ url = pages[k].imageinfo[0].url; break; }
    }catch(e){}
  }
  REC[w] = url; store.set(recKey(w), url || '');
  return url;
}
function prefetchRecs(list){ if (CFG.lang==='en') (list||[]).forEach(x => findRec(x.w)); }

let curAudio = null;
function stopSpeech(){
  try{ if(curAudio){ curAudio.pause(); curAudio = null; } }catch(e){}
  if(canSpeak) speechSynthesis.cancel();
}
// device-voice fallback (quality varies); the setTimeout dodges a Chrome bug that drops speech right after cancel()
function webSpeak(text, slow){
  if(!canSpeak) return;
  speechSynthesis.cancel();
  if(!voice) pickVoice();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if (voice) u.voice = voice;
    u.rate = slow ? 0.6 : 0.8;
    u.pitch = 1;
    speechSynthesis.speak(u);
  }, 40);
}
async function speak(text, slow){
  stopSpeech();
  const url = await findRec(text);
  if (url && canAudio){
    const a = new Audio(url);
    try{ a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = true; }catch(e){}
    a.playbackRate = slow ? 0.6 : 1;        // slow the recording without changing its pitch
    curAudio = a;
    let fell = false;
    const fall = () => { if(fell) return; fell = true; if(curAudio===a) curAudio = null; webSpeak(text, slow); };
    a.onerror = fall;
    const p = a.play();
    if (p && p.catch) p.catch(fall);        // e.g. browser can't play OGG → use the device voice
    return;
  }
  webSpeak(text, slow);
}
const spkIcon = `<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const en = w => `<span class="ltr">${esc(w)}</span>`;

/* ---------- card types ---------- */
const TYPES = {
  spell: { tag:'איות', need:c=>c.d,
    front:c=>`<div class="lbl">ההגדרה:</div><div class="q">${fmtDef(c.d)}</div>`,
    ask:'איזו מילה זאת? כתבי אותה על הדף',
    back:c=>`<div class="lbl">המילה הנכונה:</div><div class="big word">${esc(c.w)}</div>`,
    tip:'בדקי אות אחרי אות: האם כתבת בדיוק ככה?', wrong:'טיפ: כתבי את המילה הנכונה 3 פעמים על הדף.' },
  mean: { tag:'משמעות', need:c=>c.d,
    front:c=>`<div class="lbl">המילה:</div><div class="big word">${esc(c.w)}</div>`,
    ask:'מה פירוש המילה? כתבי במילים שלך על הדף',
    back:c=>`<div class="lbl">ההגדרה:</div><div class="q">${fmtDef(c.d)}</div>`,
    tip:'לא חייב מילה במילה. העיקר שהרעיון דומה.', wrong:'קראי את ההגדרה בקול פעם אחת.' },
  tr: { tag:'מעברית לאנגלית', need:c=>c.d,
    front:c=>`<div class="lbl">בעברית:</div><div class="big word">${esc(c.d)}</div>`,
    ask:'איך כותבים את זה באנגלית? כתבי על הדף',
    back:c=>`<div class="lbl">באנגלית:</div><div class="big word">${en(c.w)}</div>
      <button class="btn ghost spk" data-say="${esc(c.w)}">${spkIcon} שמיעה</button>`,
    tip:'בדקי אות אחרי אות: האם כתבת בדיוק ככה?', wrong:'טיפ: כתבי את המילה הנכונה 3 פעמים על הדף.' },
  dict: { tag:'הכתבה', need:()=>canPlay, auto:true,
    front:c=>`<div class="row" style="margin-top:14px">
      <button class="btn spk big-spk" data-say="${esc(c.w)}">${spkIcon} שמיעה</button>
      <button class="btn ghost spk" data-say="${esc(c.w)}" data-slow="1">לאט</button></div>`,
    ask:'הקשיבי וכתבי את המילה באנגלית על הדף',
    back:c=>`<div class="lbl">המילה:</div><div class="big word">${en(c.w)}</div>${c.d ? `<div class="q">${esc(c.d)}</div>` : ''}`,
    tip:'בדקי אות אחרי אות: האם כתבת בדיוק ככה?', wrong:'טיפ: הקשיבי שוב וכתבי את המילה 3 פעמים.' }
};

let weeks = [];       // all dictations from the sheet
let sel = -1;         // index of the selected week
let words = [];       // words of the selected week (what the games use)
let status = 'loading';
const DKEY = CACHE + '-date';
function weekLabel(wk, i){ return wk.date || (wk.words[0] ? wk.words[0].w : ('#' + (i+1))); }
// choose which week is active: the one the child picked last time if it's still there, else the default
function applyDefault(){
  if (!weeks.length){ sel = -1; words = []; return; }
  let i = -1;
  const saved = store.get(DKEY);
  if (saved) i = weeks.findIndex(wk => (wk.date || '') === saved);
  if (i < 0) i = weeks.length - 1;          // latest = most recent (bottom of the sheet)
  sel = Math.max(0, i);
  words = (weeks[sel] && weeks[sel].words) || [];
}
function selectWeek(i){
  if (i < 0 || i >= weeks.length) return;
  sel = i; words = weeks[i].words;
  store.set(DKEY, weeks[i].date || '');
  home();
}
const app = document.getElementById('app');
const dog = cls => `<svg class="dog ${cls||''}" viewBox="0 0 330 190" role="img" aria-label="זיגי הכלב"><use href="#ziggy"/></svg>`;
let S = {};
const CHEERS = ['כל הכבוד!','זיגי מכשכש בזנב!','מעולה, גילי!','וואו, יפה מאוד!','ככה בדיוק!','הב הב! נכון!'];
const COMFORT = ['לא נורא, זה חוזר עוד מעט','זיגי בטוח שבפעם הבאה תצליחי','קורה! עוד ניסיון קטן ונצליח'];

function home(){
  S = {};
  const ready = words.length > 0;
  const selDate = sel >= 0 && weeks[sel] ? weeks[sel].date : '';
  const note = status === 'loading' ? 'טוענת את ההכתבות מהגיליון של המורה…'
    : status === 'live' ? (ready ? `${words.length} מילים${selDate ? ' להכתבה ' + esc(selDate) : ''}` : 'בחרי תאריך כדי להתחיל')
    : status === 'cached' ? `לא הצלחתי להתחבר לגיליון, אז אלה ההכתבות מהפעם הקודמת`
    : 'לא הצלחתי לטעון את ההכתבות מהגיליון.';
  app.innerHTML = `
  <div class="center"><div class="hero-dog">${dog()}</div><h1>${CFG.title}</h1>
  <p class="lead">${CFG.sub}</p><p class="status ${status}">${note}</p>
  ${status==='error' ? `<button class="btn" id="retry">לנסות שוב</button>` : ''}</div>
  <div class="card ${ready?'':'dim'}">
    ${weeks.length ? `<label class="lbl" for="wk">בחרי תאריך הכתבה:</label>
    <select id="wk" class="datesel">${weeks.map((wk,i) => ({wk,i})).reverse().map(({wk,i}) =>
      `<option value="${i}" ${i===sel?'selected':''}>${esc(weekLabel(wk,i))}</option>`).join('')}</select>` : ''}
    <h2 style="margin-top:${weeks.length?'20px':'0'}">מה משחקים היום?</h2>
    <div class="modes">${CFG.modes.map(([m,t,s]) =>
      `<button class="btn mode" data-m="${m}" ${ready?'':'disabled'}>${t}<small>${s}</small></button>`).join('')}</div>
    ${CFG.lang==='en' && !canPlay ? `<div class="tip">הדפדפן הזה לא יודע להשמיע מילים. כדאי לפתוח בכרום כדי לשחק בהכתבה.</div>` : ''}
    <div class="tip">מכינים דף ועיפרון. כותבים את התשובה על הדף, ורק אחר כך לוחצים "הראי לי".</div>
  </div>
  ${CFG.other ? `<div class="center"><a class="link" href="${CFG.other[0]}">${CFG.other[1]}</a></div>` : ''}`;
  const wsel = document.getElementById('wk'); if (wsel) wsel.onchange = () => selectWeek(+wsel.value);
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => start(b.dataset.m));
  const r = document.getElementById('retry'); if (r) r.onclick = init;
}

function start(mode, only){
  const pool = only || words;
  let q = [];
  for (const t of mode.split(',')) q = q.concat(shuffle(pool.filter(TYPES[t].need)).map(x=>({...x,t})));
  if (!q.length) return;
  prefetchRecs(pool);                        // warm up the human recordings so playback is instant
  S = { mode, q, i:0, total:q.length, done:0, first:0, missed:new Map(), tried:new Set(), revealed:false };
  card();
}

function card(){
  if (S.i >= S.q.length) return end();
  const c = S.q[S.i], T = TYPES[c.t]; S.revealed = false; S.lock = false;
  const pct = Math.round(S.done / S.total * 100);
  app.innerHTML = `
  <div class="top"><button class="link" id="back">יציאה</button><div class="bar"><i style="width:${pct}%"></i></div><b>${S.done}/${S.total}</b></div>
  <div class="play-dog" style="max-width:300px;margin:0 auto">${dog()}</div>
  <div class="card center">
    <span class="tag">${T.tag}</span>
    <div style="margin-top:14px">${T.front(c)}</div>
    <div class="ask">${T.ask}</div>
    <div class="row" id="revealRow"><button class="btn" id="reveal">כתבתי! הראי לי</button></div>
    <div class="ans hide" id="ans">
      ${T.back(c)}
      <div class="tip">${T.tip}</div>
      <div class="row pair"><button class="btn ok" id="yes">צדקתי</button><button class="btn no" id="no">טעיתי</button></div>
    </div>
    <div class="keys">אפשר גם מקלדת: רווח כדי לחשוף, 1 = צדקתי, 2 = טעיתי</div>
  </div>`;
  document.getElementById('back').onclick = () => { stopSpeech(); home(); };
  document.getElementById('reveal').onclick = reveal;
  document.getElementById('yes').onclick = () => answer(true);
  document.getElementById('no').onclick = () => answer(false);
  app.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say, !!b.dataset.slow));
  if (T.auto) speak(c.w);
}
function reveal(){
  if (S.revealed || S.lock) return; S.revealed = true;
  document.getElementById('revealRow').classList.add('hide');
  document.getElementById('ans').classList.remove('hide');
  document.getElementById('yes').focus();
}
function answer(ok){
  if (!S.revealed || S.lock) return; S.lock = true;
  const c = S.q[S.i], key = c.t + c.w, d = app.querySelector('.dog');
  const firstTry = !S.tried.has(key); S.tried.add(key);
  if (ok){ S.done++; if(firstTry) S.first++; }
  else { S.missed.set(key, c); S.q.push(c); }
  d.classList.add(ok ? 'happy' : 'sad');
  const ans = document.getElementById('ans');
  ans.querySelector('.row').innerHTML = `<div class="big" style="font-size:28px;color:${ok?'var(--ok)':'var(--red)'}">${ok ? CHEERS[Math.random()*CHEERS.length|0] : COMFORT[Math.random()*COMFORT.length|0]}</div>`;
  if (!ok) ans.querySelector('.tip').textContent = TYPES[c.t].wrong;
  setTimeout(() => { S.i++; card(); }, ok ? 1100 : 2000);
}

function end(){
  const missWords = [...new Map([...S.missed.values()].map(m=>[m.w,{w:m.w,d:m.d}])).values()];
  const show = w => CFG.lang==='en' ? en(w) : esc(w);
  const showD = d => CFG.lang==='en' ? `<div>${esc(d)}</div>` : `<div>${fmtDef(d)}</div>`;
  app.innerHTML = `
  <div class="center">${dog('happy')}</div>
  <div class="card center">
    <h2>כל הכבוד, גילי!</h2>
    <div class="big score">${S.first}/${S.total}</div>
    <p class="lead">נכונות כבר בפעם הראשונה</p>
    ${missWords.length ? `<div class="tip" style="text-align:start"><b>כדאי לחזור על:</b>
      <ul class="miss">${missWords.map(m=>`<li><b>${show(m.w)}</b>${m.d?showD(m.d):''}</li>`).join('')}</ul></div>`
      : `<p class="lead">בלי אף טעות! זיגי גאה בך.</p>`}
    <div class="row">
      ${missWords.length ? `<button class="btn no" id="again-miss">רק המילים שטעיתי בהן</button>` : ''}
      <button class="btn" id="again">עוד סבב</button>
      <button class="btn ghost" id="home">לדף הבית</button>
    </div>
  </div>`;
  const mode = S.mode;
  document.getElementById('again').onclick = () => start(mode);
  document.getElementById('home').onclick = home;
  const am = document.getElementById('again-miss');
  if (am) am.onclick = () => start(mode, words.filter(w => missWords.some(m=>m.w===w.w)));
}

document.addEventListener('keydown', e => {
  if (!S.q) return;
  if ((e.key === ' ' || e.key === 'Enter') && !S.revealed && !S.lock && document.getElementById('reveal')) { e.preventDefault(); reveal(); }
  else if (S.revealed && e.key === '1') answer(true);
  else if (S.revealed && e.key === '2') answer(false);
});

async function init(){
  status = 'loading';
  try { const c = JSON.parse(store.get(CACHE) || 'null'); if (Array.isArray(c) && c[0] && Array.isArray(c[0].words)){ weeks = c; applyDefault(); } } catch(e){}
  home();
  const w = await loadWeeks();
  if (w){ weeks = w; status = 'live'; store.set(CACHE, JSON.stringify(w)); applyDefault(); }
  else status = weeks.length ? 'cached' : 'error';
  if (!S.q) home();
}
init();
}
</script>
